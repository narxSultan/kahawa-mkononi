name: kahawa_mkononi_customer
description: KAHAWA MKONONI Customer Portal (Flutter)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  graphql_flutter: ^5.1.2
  flutter_secure_storage: ^10.3.1
  intl: ^0.19.0
  http: ^1.2.2
  http_parser: ^4.0.2
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  image_picker_android:
    path: third_party/image_picker_android

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true
